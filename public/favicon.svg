      <stop offset="0%" stop-color="#E9C874"/>
      <stop offset="50%" stop-color="#C9A24A"/>
      <stop offset="100%" stop-color="#9C7A2E"/>
    </linearGradient>
  </defs>
  <circle cx="60" cy="60" r="56" fill="#0E3B31"/>
  <circle cx="60" cy="60" r="49" fill="none" stroke="url(#goldGrad)" stroke-width="1.4"/>
