name: Deploy Owner Portal API to Cloudflare Workers

on: {push: {branches: [main], paths: ["worker/**", ".github/workflows/deploy-api.yml"]}, workflow_dispatch: null}

jobs: {deploy: {runs-on: ubuntu-latest, steps: [{uses: "actions/checkout@v4"}, {name: "Deploy Worker", uses: "cloudflare/wrangler-action@v3", with: {apiToken: "${{ secrets.CLOUDFLARE_API_TOKEN }}", accountId: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}", workingDirectory: worker, command: deploy}}]}}
